<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Blog</title>
</head>
<body>
  {% if user.is_authenticated %}
    <a href="{% url 'admin_page' %}">Admin page</a>
  {% else %}
    <a href="{% url 'login' %}">Admin login</a>
  {% endif %}

  <h1>Articles</h1>

  {% if articles %}
    <ul>
      {% for article in articles %}
        <li>
          <a href="{% url 'article_detail' article.id %}">{{ article.title }}</a>
          <small>{{ article.published_at|date:"F j, Y" }}</small>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No articles have been published yet.</p>
  {% endif %}
</body>
</html>
